<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Šolski IS</title>
<meta name="description" content="Prototip šolskega informacijskega sistema za delo na daljavo: predmeti, gradiva in oddaja nalog.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fcfdff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17231e" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2.5' y='2.5' width='19' height='19' rx='3' fill='%23fff' stroke='%231e3a8a' stroke-width='1.8'/%3E%3Cpath d='M2.5 9h19M2.5 15h19M10.5 2.5v19M16 2.5v19' stroke='%231e3a8a' stroke-opacity='.35'/%3E%3Cpath d='M6.5 2.5v19' stroke='%23c42b26' stroke-width='1.8'/%3E%3C/svg%3E">
<!-- Pisava Atkinson Hyperlegible (zasnovana za berljivost). Bunny Fonts je evropska, GDPR-prijazna kopija Google Fonts.
     Brez interneta se uporabi sistemska pisava. -->
<link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=atkinson-hyperlegible:400,400i,700,700i&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
  // Tema se nastavi pred izrisom, da stran ne utripne.
  try { var t = localStorage.getItem('solski-is:tema'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="js/email.js" defer></script>
<script src="js/podatki.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<a class="preskoci" href="#vsebina">Preskoči na vsebino</a>
<header class="glava" id="glava"></header>
<main id="vsebina" tabindex="-1">
  <noscript>
    <div class="okvir">
      <div class="prazno">
        <h1>Prototip potrebuje JavaScript</h1>
        <p>Vklopite JavaScript v brskalniku in osvežite stran.</p>
      </div>
    </div>
  </noscript>
</main>
<footer class="noga" id="noga"></footer>
<dialog id="dialog" class="dialog" aria-labelledby="dialog-naslov"></dialog>
<div class="obvestila" id="obvestila" role="status" aria-live="polite"></div>
</body>
</html>
